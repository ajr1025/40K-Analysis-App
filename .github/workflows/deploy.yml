# Publish to GitHub Pages on every push to main.
#
# The dataset is committed rather than rebuilt here: `npm run data` pulls ~80MB
# from the GitHub API, which is both slow and rate-limited in CI. Refreshing it
# is a separate, deliberate step (`npm run data` locally, then commit), so a
# deploy can never silently change the numbers.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Failures are written into the job summary, which is readable on a
      # public repo without admin rights -- downloading the raw log is not.
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.log || {
            {
              echo '### Test failure'
              echo '```'
              tail -120 /tmp/test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
